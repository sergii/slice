name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Emit final boundary formatting
        shell: bash
        run: |
          npx oxfmt --write scripts/demo-responsively.mjs
          echo "SLICE_FMT_BOUNDARY_FINAL"
          base64 -w0 scripts/demo-responsively.mjs
          echo
          echo "SLICE_FMT_END"

      # Fast deterministic gates first. Browser setup does not start unless these pass.
      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Validate npm package
        run: npm run validate:package

      # Browser-dependent checks are intentionally last because Chromium setup is expensive.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

      - name: Smoke test built CLI
        run: npm run smoke

      - name: Demo project
        run: npm run demo

      - name: Responsively visual demo harness
        run: npm run demo:responsively:check
