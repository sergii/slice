name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      # Temporary bootstrap output. Removed once package-lock.json is committed.
      - name: Emit package lock
        run: |
          node -e "const fs=require('node:fs'); console.log('SLICE_PACKAGE_LOCK_BEGIN'); console.log(fs.readFileSync('package-lock.json').toString('base64')); console.log('SLICE_PACKAGE_LOCK_END')"

      # Fast deterministic gates first. Browser setup does not start unless these pass.
      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Validate npm package
        run: npm run validate:package

      # Browser-dependent checks are intentionally last because Chromium setup is expensive.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

      - name: Smoke test built CLI
        run: npm run smoke
