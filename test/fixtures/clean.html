<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: 100%; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="grid"><div>One</div><div>Two</div><div>Three</div></div>
  </main>
</body>
</html>
